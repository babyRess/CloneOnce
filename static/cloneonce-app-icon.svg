    <path d="M185 670 H330 C356 670 377 688 392 707 L430 756 H514 C544 756 568 780 568 810 V844 C568 876 542 902 510 902 H218 C180 902 150 872 150 834 V705 C150 686 166 670 185 670Z" fill="url(#blue)"/>
