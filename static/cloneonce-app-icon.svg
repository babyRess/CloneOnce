    <path d="M704 618 H793" stroke="#2563eb" stroke-width="34" stroke-linecap="round"/>
    <path d="M766 574 L810 618 L766 662" fill="none" stroke="#2563eb" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

