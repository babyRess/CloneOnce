    <rect x="394" y="362" width="398" height="246" rx="38" fill="#f9fcff" stroke="#b8cde6" stroke-width="4" opacity="0.86"/>
    <circle cx="418" cy="346" r="15" fill="#ff6258" stroke="#cf443a" stroke-width="3"/>
    <circle cx="465" cy="346" r="15" fill="#ffbd2e" stroke="#d89410" stroke-width="3"/>
    <circle cx="512" cy="346" r="15" fill="#29c840" stroke="#15912a" stroke-width="3"/>
    <rect x="570" y="438" width="166" height="24" rx="12" fill="#9bb7d6" opacity="0.58"/>
