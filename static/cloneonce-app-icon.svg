<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CloneOnce app icon</title>
  <desc id="desc">Two overlapping app windows with a single launch arrow and profile path, representing one clean app clone.</desc>
  <defs>
    <linearGradient id="base" x1="166" y1="94" x2="862" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.43" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#d4e5f7"/>
    </linearGradient>
    <linearGradient id="blue" x1="247" y1="693" x2="714" y2="943" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.58" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="window" x1="276" y1="174" x2="776" y2="622" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ddebfb" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="shine" x1="239" y1="128" x2="818" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1f2937" flood-opacity="0.22"/>
    </filter>
    <filter id="deepShadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#1d4ed8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#base)"/>
  <rect x="66" y="66" width="892" height="892" rx="210" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.72"/>
  <rect x="95" y="95" width="834" height="834" rx="184" fill="none" stroke="#99b8d8" stroke-width="4" opacity="0.32"/>

  <g filter="url(#softShadow)">
    <rect x="244" y="188" width="426" height="328" rx="58" fill="url(#window)" stroke="#ffffff" stroke-width="11"/>
    <rect x="278" y="238" width="358" height="246" rx="36" fill="#f7fbff" stroke="#b8cde6" stroke-width="4" opacity="0.76"/>
    <circle cx="318" cy="224" r="15" fill="#ff6258" stroke="#cf443a" stroke-width="3"/>
    <circle cx="365" cy="224" r="15" fill="#ffbd2e" stroke="#d89410" stroke-width="3"/>
    <circle cx="412" cy="224" r="15" fill="#29c840" stroke="#15912a" stroke-width="3"/>
  </g>

  <g filter="url(#softShadow)">
